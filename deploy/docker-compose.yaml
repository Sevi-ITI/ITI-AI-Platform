# The whole ITI AI Platform in Docker (step 9.5.4): database, model server, migrations, API, Console.
# Start (repo root):  docker compose -f deploy/docker-compose.yaml up -d --build
# Same file on every machine; what differs lives in that machine's deploy/.env (see deploy/.env.example) and
# backend/.env (the API's own settings, as today). Every port is bound to 127.0.0.1: only Caddy (9.5.5) faces the network.
# Project "deploy", like docker-compose.dev.yaml, so the existing postgres container and its volume iti-pg are reused.
# Never add --remove-orphans: it would delete the dev records container (docker-compose.records.yaml, same project).

name: deploy

services:

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: iti
      POSTGRES_PASSWORD: ${ITI_PG_PASSWORD:?set ITI_PG_PASSWORD in deploy/.env}
      POSTGRES_DB: iti_ai
      TZ: Asia/Manila
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - iti-pg:/var/lib/postgresql/data
    healthcheck:
      test:  ["CMD-SHELL", "pg_isready -U iti -d iti_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
# The model server on the GPU. Profile "model": COMPOSE_PROFILES=model in deploy/.env starts it; leave it out when
  # ITI_OLLAMA_URL points to an Ollama elsewhere (cloud set-up C2). The settings match the laptop's native Ollama.

  ollama:
    image: ollama/ollama:0.35.0
    profiles: ["model"]
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${ITI_LLM_PARALLEL:-1}
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - iti-ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: iti-ai-api:${ITI_IMAGE_TAG:-dev}
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    env_file: ${ITI_API_ENV_FILE:-../backend/.env}
    environment: &api-env
      ITI_DATABASE_URL: postgresql+psycopg://iti@postgres:5432/iti_ai
      PGPASSWORD: ${ITI_PG_PASSWORD:?set ITI_PG_PASSWORD in deploy/.env}
      ITI_OLLAMA_URL: ${ITI_OLLAMA_URL:-http://ollama:11434}
      ITI_OLLAMA_ALLOWED_HOSTS:
        ${ITI_OLLAMA_ALLOWED_HOSTS:-127.0.0.1,localhost,::1,ollama}
      ITI_LLM_PARALLEL: ${ITI_LLM_PARALLEL:-1}
      ITI_UPLOAD_DIR: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

# The API: one process on purpose (the answer queue lives in it).
  api:
    image: iti-ai-api:${ITI_IMAGE_TAG:-dev}
    build: ../backend
    restart: unless-stopped
    env_file: ${ITI_API_ENV_FILE:-../backend/.env}
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${ITI_UPLOADS_DIR:-../data/uploads}:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
        required: false

# The Console. Admin work on http://127.0.0.1:3000 on this machine; testers come through Caddy.

  console:
    image: iti-ai-console:${ITI_IMAGE_TAG:-dev}
    build: ../admin-ui
    restart: unless-stopped
    environment:
      ITI_API_URL: http://api:8000
      CONSOLE_COOKIE_SECURE: ${CONSOLE_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  iti-pg:
  iti-ollama:

