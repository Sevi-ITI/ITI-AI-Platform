# SQL Server 2022 (Developer edition) for the Phase 8 records DB, laptop only.
# Start: docker compose -f deploy/docker-compose.records.yaml up -d
# Data lives in the named volume "iti-records" (only `down -v` deletes it). Port bound to 127.0.0.1:
# other PCs on the network can't reach it. Tables, views and test data: deploy/records-db/README.md.
services:
  records:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${ITI_RECORDS_SA_PASSWORD:?set ITI_RECORDS_SA_PASSWORD in deploy/.env}
      TZ: Asia/Manila
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - iti-records:/var/opt/mssql
      - ./records-db:/records-db:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  iti-records:
