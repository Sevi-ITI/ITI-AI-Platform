<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview – ITI AI Console (3D AI Headquarters)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* ==========================================================================
       1. BRAND TOKENS (Source of truth: admin-ui/src/app/globals.css)
       Never raw hex in components — all colors map strictly to these tokens.
       ========================================================================== */
    @font-face {
      font-family: 'ComfortaaLocal';
      src: local('Comfortaa'), local('Comfortaa Regular'), local('Nunito'), local('Quicksand'), local('Segoe UI Rounded');
      font-display: swap;
    }

    :root,
    html[data-theme="dark"] {
      color-scheme: dark;
      /* Anchors */
      --navy: #0A1128;
      --cream: #F4F1EA;
      --paper: #FFFDF8;
      --indigo: #6E76F0;
      --gold: #9A6B12;

      /* Semantic tokens — Dark (default) */
      --bg: #0A1128;
      --surface: #111A34;
      --surface-raised: #17213F;
      --surface-sunken: #070C1D;
      --surface-nested: rgba(255, 255, 255, 0.035);
      --text: #EEF0F6;
      --text-muted: #B5BBC7;
      --text-subtle: #8F98AB;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.13);
      --border-strong: rgba(255, 255, 255, 0.28);
      --accent: #6E76F0;
      --accent-soft: rgba(110, 118, 240, 0.16);
      --hover: rgba(110, 118, 240, 0.10);
      --focus-ring: #6E76F0;
      --button-primary-bg: #F4F1EA;
      --button-primary-text: #0A1128;
      --ok: #5CC98F;
      --ok-soft: rgba(92, 201, 143, 0.14);
      --warn: #E9B25C;
      --warn-soft: rgba(233, 178, 92, 0.14);
      --error: #F07C7C;
      --error-soft: rgba(240, 124, 124, 0.14);
      --scrollbar-thumb: #2A3557;
      --grid-line: rgba(255, 255, 255, 0.03);

      /* Depth & Elevation */
      --elevation-1: 0 4px 12px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      --elevation-2: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      --elevation-3: 0 22px 52px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --hud-backdrop: rgba(17, 26, 52, 0.90);
      --hud-raised-backdrop: rgba(23, 33, 63, 0.94);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #F4F1EA;
      --surface: #FFFDF8;
      --surface-raised: #FFFDF8;
      --surface-sunken: #EFECE4;
      --surface-nested: rgba(154, 107, 18, 0.055);
      --text: #2C2212;
      --text-muted: #5C5242;
      --text-subtle: #7A6E5B;
      --border-subtle: rgba(154, 107, 18, 0.15);
      --border: rgba(154, 107, 18, 0.25);
      --border-strong: rgba(154, 107, 18, 0.42);
      --accent: #9A6B12;
      --accent-soft: rgba(154, 107, 18, 0.13);
      --hover: rgba(154, 107, 18, 0.08);
      --focus-ring: #9A6B12;
      --button-primary-bg: #9A6B12;
      --button-primary-text: #FFFDF8;
      --ok: #39734F;
      --ok-soft: rgba(57, 115, 79, 0.10);
      --warn: #8A5A00;
      --warn-soft: rgba(138, 90, 0, 0.10);
      --error: #B3261E;
      --error-soft: rgba(179, 38, 30, 0.08);
      --scrollbar-thumb: rgba(154, 107, 18, 0.34);
      --grid-line: rgba(154, 107, 18, 0.055);

      --elevation-1: 0 4px 14px rgba(120, 92, 38, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --elevation-2: 0 12px 28px rgba(120, 92, 38, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --elevation-3: 0 20px 44px rgba(120, 92, 38, 0.19), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      --hud-backdrop: rgba(255, 253, 248, 0.92);
      --hud-raised-backdrop: rgba(255, 253, 248, 0.96);
    }

    :root {
      --font-sans: 'ComfortaaLocal', 'Comfortaa', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;

      --text-xs: 12px;
      --text-sm: 13px;
      --text-md: 15px;
      --text-lg: 18px;
      --text-xl: 24px;
      --text-2xl: clamp(28px, 2.6vw, 36px);

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --float-gap: 16px;

      --radius-sm: 0.9rem;
      --radius-md: 1.4rem;
      --radius-lg: clamp(1.5rem, 2vw, 2.5rem);
      --radius-float: 1.75rem;
      --radius-pill: 9999px;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --duration-fast: 180ms;
      --duration-med: 420ms;
    }

    html[data-reduced-motion="true"] {
      --duration-fast: 0ms;
      --duration-med: 0ms;
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --duration-fast: 0ms;
        --duration-med: 0ms;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 2rem 2rem;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--text-md);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimal scrollbar: thumb only, no track */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
      background: transparent;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: var(--radius-pill);
    }

    /* Accessible Focus Ring */
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* Skip Link */
    .skip-link {
      position: fixed;
      top: -60px;
      left: var(--float-gap);
      z-index: 9999;
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: var(--text-sm);
      text-decoration: none;
      box-shadow: var(--elevation-3);
      transition: top var(--duration-fast) var(--ease-out);
    }
    .skip-link:focus {
      top: var(--float-gap);
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 0.92em;
    }

    /* ==========================================================================
       2. APP SHELL & 3D VIEWPORT
       ========================================================================== */
    #app-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #webgl-container:active {
      cursor: grabbing;
    }

    /* 3D Accessible Hotspot Layer */
    #hotspot-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .hotspot-pin {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      box-shadow: var(--elevation-2);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color var(--duration-fast) var(--ease-out),
                  background-color var(--duration-fast) var(--ease-out);
    }
    .hotspot-pin:hover,
    .hotspot-pin:focus-visible {
      border-color: var(--accent);
      background: var(--surface);
      z-index: 25;
    }
    .hotspot-pin[aria-current="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft), var(--elevation-2);
      background: var(--surface-raised);
      z-index: 20;
    }
    .hotspot-pin.locked {
      opacity: 0.62;
      border-style: dashed;
    }
    .hotspot-wing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .hotspot-pin.ok .hotspot-wing-dot { background: var(--ok); }
    .hotspot-pin.warn .hotspot-wing-dot { background: var(--warn); }
    .hotspot-pin.error .hotspot-wing-dot { background: var(--error); }

    .xia-name-tag {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      border: 2px solid var(--accent);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      box-shadow: var(--elevation-2);
      white-space: nowrap;
      z-index: 22;
    }

    /* ==========================================================================
       3. FLOATING HUD SHELL (Detached from viewport edges with 16px margin)
       ========================================================================== */
    .hud-top-bar {
      position: fixed;
      top: var(--float-gap);
      left: var(--float-gap);
      right: var(--float-gap);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      pointer-events: none;
      flex-wrap: wrap;
    }

    .hud-card {
      pointer-events: auto;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-float);
      box-shadow: var(--elevation-2);
    }

    .brand-bar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 8px 14px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      font-weight: 700;
      font-size: var(--text-sm);
      letter-spacing: 0.04em;
    }

    .brand-title-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }
    .brand-title {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--text);
    }
    .brand-subtitle {
      font-size: var(--text-xs);
      color: var(--text-subtle);
    }

    /* Roof Beacon Status Pill (never color alone: dot + icon + word) */
    .beacon-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: var(--text-xs);
      font-weight: 700;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .beacon-pill:hover {
      transform: translateY(-1px);
    }
    .beacon-pill.ok {
      background: var(--ok-soft);
      border-color: var(--ok);
      color: var(--text);
    }
    .beacon-pill.warn {
      background: var(--warn-soft);
      border-color: var(--warn);
      color: var(--text);
    }
    .beacon-pill.error {
      background: var(--error-soft);
      border-color: var(--error);
      color: var(--text);
    }
    .beacon-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .beacon-pill.ok .beacon-dot { background: var(--ok); }
    .beacon-pill.warn .beacon-dot { background: var(--warn); }
    .beacon-pill.error .beacon-dot { background: var(--error); }

    /* Account & Mode Corner Card */
    .account-bar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 7px 12px;
      flex-wrap: wrap;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: var(--text-xs);
      font-weight: 700;
    }

    /* Floating Wing Dock (Left / Collapsible in 3D Mode) */
    .hud-wing-dock {
      position: fixed;
      top: 76px;
      left: var(--float-gap);
      bottom: 76px;
      width: 248px;
      z-index: 35;
      display: flex;
      flex-direction: column;
      padding: var(--space-3);
      overflow-y: auto;
      gap: var(--space-3);
      transition: transform var(--duration-med) var(--ease-out),
                  opacity var(--duration-fast) var(--ease-out);
    }
    .hud-wing-dock.collapsed {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }

    .wing-dock-toggle-btn {
      position: fixed;
      top: 76px;
      left: var(--float-gap);
      z-index: 36;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: transform var(--duration-fast) var(--ease-out),
                  opacity var(--duration-fast) var(--ease-out),
                  border-color var(--duration-fast) var(--ease-out);
    }
    .wing-dock-toggle-btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .wing-dock-toggle-btn.hidden-tab {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-16px);
    }

    .wing-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wing-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
      padding: 4px 8px;
    }

    .nav-station-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 8px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--duration-fast) var(--ease-out),
                  color var(--duration-fast) var(--ease-out),
                  border-color var(--duration-fast) var(--ease-out);
    }
    .nav-station-btn:hover:not(:disabled) {
      background: var(--hover);
      color: var(--text);
    }
    .nav-station-btn[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent);
      font-weight: 700;
    }
    .nav-station-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }
    .nav-station-meta {
      font-size: var(--text-xs);
      color: var(--text-subtle);
      display: block;
      font-weight: 400;
    }

    /* Bottom Sims 4 Camera Bar (Collapsible with Arrow-Up Pop-up) */
    .hud-camera-bar {
      position: fixed;
      bottom: var(--float-gap);
      left: var(--float-gap);
      z-index: 35;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 8px 14px;
      flex-wrap: wrap;
      transition: transform var(--duration-med) var(--ease-out),
                  opacity var(--duration-fast) var(--ease-out);
    }
    .hud-camera-bar.collapsed {
      transform: translateY(calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
    }

    .cam-bar-expand-btn {
      position: fixed;
      bottom: var(--float-gap);
      left: var(--float-gap);
      z-index: 36;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-md);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: transform var(--duration-fast) var(--ease-out),
                  opacity var(--duration-fast) var(--ease-out),
                  border-color var(--duration-fast) var(--ease-out);
    }
    .cam-bar-expand-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .cam-bar-expand-btn.hidden-tab {
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
    }

    .cam-readout {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
      padding: 4px 10px;
      background: var(--surface-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
    }

    /* Right Floating HUD Feature Panel */
    .hud-feature-panel {
      position: fixed;
      top: 76px;
      right: var(--float-gap);
      bottom: var(--float-gap);
      width: min(680px, calc(100vw - 296px));
      z-index: 38;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform var(--duration-med) var(--ease-out),
                  opacity var(--duration-fast) var(--ease-out);
    }
    .hud-feature-panel.minimized {
      transform: translateX(calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
    }

    .panel-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      background: var(--surface-raised);
    }
    .breadcrumbs {
      font-size: var(--text-xs);
      color: var(--text-subtle);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: var(--text-xl);
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }
    .panel-desc {
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Security Password Gate Bar */
    .security-gate-bar {
      background: var(--warn-soft);
      border-bottom: 1px solid var(--warn);
      padding: 10px var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
      font-size: var(--text-sm);
    }
    .security-gate-bar.unlocked {
      background: var(--ok-soft);
      border-bottom-color: var(--ok);
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* ==========================================================================
       4. SHARED UI CONTROLS (Buttons, Cards, Tables, Tabs, Inputs, Badges)
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--duration-fast) var(--ease-out),
                  background-color var(--duration-fast) var(--ease-out),
                  border-color var(--duration-fast) var(--ease-out);
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) {
      background: var(--hover);
      border-color: var(--border-strong);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Primary button = navy/paper contract: paper on navy (dark), navy on paper (light) */
    .btn-primary {
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      border-color: transparent;
    }
    html[data-theme="light"] .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      background: var(--gold);
      color: var(--paper);
    }
    html[data-theme="dark"] .btn-primary:hover:not(:disabled) {
      background: var(--paper);
      color: var(--navy);
    }

    .btn-solid-dark {
      background: var(--surface-sunken);
      color: var(--text);
    }
    .btn-solid-dark:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn-danger {
      background: var(--error-soft);
      color: var(--error);
      border-color: var(--error);
    }

    .input, .select, .textarea, select {
      background-color: var(--surface-sunken);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 600;
      line-height: 1.4;
      box-shadow: var(--elevation-1);
      transition: border-color var(--duration-fast) var(--ease-out),
                  background-color var(--duration-fast) var(--ease-out),
                  box-shadow var(--duration-fast) var(--ease-out);
    }
    .input:hover, .select:hover, .textarea:hover, select:hover {
      border-color: var(--border-strong);
      background-color: var(--surface-raised);
    }
    .input:focus, .select:focus, .textarea:focus, select:focus {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    select, .select, .protoSelect {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding-right: 32px !important;
      background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%),
                        linear-gradient(135deg, var(--accent) 50%, transparent 50%);
      background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    select option, select optgroup {
      background-color: var(--surface-raised);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 600;
      padding: 8px 12px;
    }
    .input-sm {
      font-size: var(--text-xs);
      padding: 6px 10px;
    }

    /* Custom Themed Dropdown Menu Overlay (replaces OS-native select popup) */
    .iti-select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
    }
    .iti-select-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      background: var(--surface-sunken);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: var(--elevation-1);
      transition: border-color var(--duration-fast) var(--ease-out),
                  background-color var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out);
      white-space: nowrap;
      text-align: left;
    }
    .iti-select-trigger.pill-trigger {
      border-radius: var(--radius-pill);
      padding: 5px 12px;
    }
    .iti-select-trigger:hover {
      background: var(--surface-raised);
      border-color: var(--accent);
    }
    .iti-select-trigger[aria-expanded="true"] {
      background: var(--surface-raised);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft), var(--elevation-2);
    }
    .iti-select-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 10px;
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .iti-select-trigger[aria-expanded="true"] .iti-select-chevron {
      transform: rotate(180deg);
    }
    .iti-select-menu {
      position: fixed;
      z-index: 100000;
      min-width: 180px;
      max-height: 280px;
      overflow-y: auto;
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--elevation-3);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .iti-select-menu.open {
      display: flex;
    }
    .iti-select-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 7px 11px;
      border-radius: calc(var(--radius-sm) - 3px);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--duration-fast) var(--ease-out),
                  color var(--duration-fast) var(--ease-out);
    }
    .iti-select-option:hover,
    .iti-select-option:focus-visible {
      background: var(--hover);
      color: var(--text);
    }
    .iti-select-option[aria-selected="true"] {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent);
      font-weight: 700;
    }
    .iti-select-check {
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: var(--space-3);
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--elevation-1);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      font-size: var(--text-xs);
      color: var(--text-subtle);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-value {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text);
    }
    .stat-note {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .section-box {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--elevation-1);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .section-title {
      font-size: var(--text-md);
      font-weight: 700;
      color: var(--text);
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-nested);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: var(--text-sm);
    }
    th {
      padding: 10px 12px;
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-subtle);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text);
      vertical-align: top;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: var(--hover);
    }

    /* Status Badges (always icon/symbol + word, never color alone) */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: var(--text-xs);
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface-nested);
      white-space: nowrap;
    }
    .badge-ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: var(--ok);
    }
    .badge-warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--warn);
    }
    .badge-error {
      background: var(--error-soft);
      color: var(--error);
      border-color: var(--error);
    }
    .badge-accent {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 4px;
      background: var(--surface-sunken);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }
    .tab-btn {
      padding: 6px 12px;
      border-radius: calc(var(--radius-sm) - 3px);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn[aria-selected="true"] {
      background: var(--surface-raised);
      color: var(--text);
      border-color: var(--accent);
      box-shadow: var(--elevation-1);
    }

    /* Bar / Meter visuals */
    .meter-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meter-label-line {
      display: flex;
      justify-content: space-between;
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
    .meter-track {
      width: 100%;
      height: 8px;
      background: var(--surface-sunken);
      border-radius: var(--radius-pill);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .meter-fill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
    }
    .meter-fill.ok { background: var(--ok); }
    .meter-fill.warn { background: var(--warn); }
    .meter-fill.error { background: var(--error); }

    /* Two-pane Chat layout inside HUD / List View */
    .chat-split {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: var(--space-3);
      min-height: 410px;
    }
    .chat-sidebar {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .chat-thread-box {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .chat-bubble {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--surface-nested);
      border: 1px solid var(--border-subtle);
      font-size: var(--text-sm);
    }
    .chat-bubble.user {
      background: var(--accent-soft);
      border-color: var(--accent);
      align-self: flex-end;
      max-width: 88%;
    }
    .citation-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* ==========================================================================
       5. LIST VIEW FALLBACK (Full Interactive Visual Redesign Layout)
       ========================================================================== */
    :root,
    html[data-theme="dark"] {
      --backdrop: rgba(7, 12, 29, 0.76);
      --button-primary-lift: none;
      --button-dark-lift: translateY(-2px);
      --gap-float: 1rem;
      --radius-xs: 0.55rem;
      --dur-fast: 180ms;
      --dur-med: 420ms;
      --sidebar-w: 15.75rem;
      --sidebar-w-rail: 4.5rem;
    }
    html[data-theme="light"] {
      --backdrop: rgba(44, 34, 18, 0.36);
      --button-primary-lift: translateY(-2px);
      --button-dark-lift: translateY(-2px);
    }

    #list-view-container {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 2rem 2rem;
      background-attachment: fixed;
    }
    body.mode-list #list-view-container {
      display: block;
    }
    body.mode-list #webgl-container,
    body.mode-list #hotspot-layer,
    body.mode-list .hud-top-bar,
    body.mode-list .hud-wing-dock,
    body.mode-list .wing-dock-toggle-btn,
    body.mode-list .hud-camera-bar,
    body.mode-list .cam-bar-expand-btn,
    body.mode-list .hud-feature-panel {
      display: none !important;
    }

    /* Interactive Prototype Inspector Bar (Top Floating Dock in List View) */
    .protoDock {
      position: sticky;
      top: var(--space-2);
      z-index: 850;
      margin: var(--space-2) var(--gap-float) 0;
      padding: var(--space-2) var(--space-4);
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      box-shadow: var(--elevation-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
      font-size: var(--text-xs);
    }
    .protoGroup {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .protoLabel {
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .protoSelect {
      padding: 4px var(--space-2);
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface-sunken);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      gap: var(--gap-float);
      padding: var(--gap-float);
      min-height: calc(100dvh - 3.5rem);
      align-items: start;
    }
    .shellFull {
      display: block;
      padding: var(--gap-float);
      min-height: calc(100dvh - 3.5rem);
    }
    .sidebar {
      position: sticky;
      top: 4.25rem;
      height: calc(100dvh - 5.25rem);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-float);
      box-shadow: var(--elevation-2);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebarHeader {
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border-subtle);
    }
    .brandBtn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-family: var(--font-sans);
    }
    .brandMark {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: var(--radius-sm);
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--text-sm);
      flex-shrink: 0;
    }
    .brandTextWrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .brandFull {
      font-size: var(--text-md);
      font-weight: 700;
      white-space: nowrap;
    }
    .companySub {
      font-size: var(--text-xs);
      color: var(--text-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .navStack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding: var(--space-4) 0;
    }
    .navGroup {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .navGroupLabel {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-subtle);
      padding: 0 var(--space-3);
      margin-bottom: 2px;
    }
    .navList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .navBtn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .navBtn:hover {
      background: var(--hover);
      color: var(--text);
    }
    .navBtn[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--text);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .navIcon {
      width: 1.15rem;
      height: 1.15rem;
      display: inline-flex;
      flex-shrink: 0;
    }
    .navBtn[aria-current="page"] .navIcon {
      color: var(--accent);
    }
    .sidebarFooter {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-subtle);
    }
    .healthPill {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--surface-nested);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
    }
    .healthDot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: var(--radius-pill);
      background: var(--ok);
      box-shadow: 0 0 0 3px var(--ok-soft);
      flex-shrink: 0;
    }
    .healthMeta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .healthTitle {
      font-size: var(--text-xs);
      font-weight: 700;
    }
    .healthTime {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-subtle);
    }
    .accountBlock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-2);
      background: var(--surface-nested);
      border-radius: var(--radius-sm);
    }
    .accountIdentity {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .accountName {
      font-size: var(--text-xs);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .roleChip {
      display: inline-flex;
      align-self: flex-start;
      font-size: var(--text-xs);
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px var(--space-2);
      border-radius: var(--radius-pill);
      font-weight: 700;
    }
    .accountActions {
      display: flex;
      gap: var(--space-1);
    }
    .iconBtn {
      width: 2rem;
      height: 2rem;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-subtle);
      background: var(--surface);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .iconBtn:hover {
      background: var(--hover);
      color: var(--text);
    }
    .mobileBar {
      display: none;
    }
    .workspace {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      min-width: 0;
      padding-bottom: var(--space-7);
    }
    .pageHeader {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-float);
      box-shadow: var(--elevation-1);
      padding: var(--space-4) var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .breadcrumbRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
      font-size: var(--text-xs);
    }
    .crumbLink {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      cursor: pointer;
      text-decoration: underline;
    }
    .crumbCurrent {
      color: var(--accent);
      font-weight: 700;
    }
    .autoRefreshBadge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-subtle);
      background: var(--surface-nested);
      padding: 2px var(--space-3);
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
    }
    .titleRow {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
    }
    .pageTitle {
      font-size: var(--text-xl);
    }
    .pageDesc {
      font-size: var(--text-sm);
      color: var(--text-muted);
      max-width: 68ch;
      margin-top: 2px;
    }
    .btnPrimary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
    }
    .btnPrimary:hover {
      transform: var(--button-primary-lift);
      box-shadow: var(--elevation-2);
    }
    .btnSecondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
    }
    .btnSecondary:hover {
      background: var(--hover);
      transform: var(--button-dark-lift);
    }
    .btnDanger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--error);
      background: var(--error-soft);
      color: var(--error);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-out);
    }
    .btnDanger:hover {
      transform: var(--button-dark-lift);
    }
    .statusPill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px var(--space-2);
      border-radius: var(--radius-pill);
      font-size: var(--text-xs);
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .pill_ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
    .pill_warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
    .pill_error { background: var(--error-soft); color: var(--error); border-color: var(--error); }
    .pill_neutral { background: var(--surface-nested); color: var(--text-muted); border-color: var(--border-subtle); }

    .copyMono {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: 2px var(--space-2);
      background: var(--surface-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xs);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
    }
    .copyBtn {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      font-size: var(--text-xs);
      padding: 0 2px;
    }
    .copyBtn:hover { color: var(--text); }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .splitMasterDetail {
      display: grid;
      grid-template-columns: 19rem minmax(0, 1fr);
      gap: var(--space-4);
      align-items: start;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--elevation-1);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--elevation-1);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .panelTitle {
      font-size: var(--text-lg);
    }
    .metaText {
      font-size: var(--text-xs);
      color: var(--text-subtle);
    }
    .metricVal {
      font-family: var(--font-mono);
      font-size: var(--text-xl);
      font-weight: 700;
    }
    .meterTrack {
      width: 100%;
      height: 0.5rem;
      background: var(--surface-sunken);
      border-radius: var(--radius-pill);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .meterFill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
    }
    .tableWrap {
      overflow-x: auto;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-xs);
    }
    .table th {
      text-align: left;
      padding: var(--space-2) var(--space-3);
      color: var(--text-subtle);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .table td {
      padding: var(--space-3);
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }
    .gateBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--elevation-1);
      flex-wrap: wrap;
    }
    .gateLocked { background: var(--warn-soft); border-color: var(--warn); }
    .gateUnlocked { background: var(--ok-soft); border-color: var(--ok); }
    .inputMono {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-sunken);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
    }
    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface-sunken);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
    }
    .segBtn {
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 700;
      cursor: pointer;
    }
    .segBtn[aria-pressed="true"] {
      background: var(--button-primary-bg);
      color: var(--button-primary-text);
    }
    .chartBars {
      height: 10rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-3);
      padding-top: var(--space-3);
      border-bottom: 1px solid var(--border-subtle);
    }
    .barCol {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: var(--space-1);
    }
    .barPair {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
    }
    .barReq { width: 38%; background: var(--accent); border-radius: 4px 4px 0 0; }
    .barErr { width: 38%; background: var(--error); border-radius: 4px 4px 0 0; }
    .loginViewport {
      min-height: calc(100dvh - 5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
    }
    .loginSplit {
      width: 100%;
      max-width: 64rem;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: var(--space-7);
      align-items: center;
    }
    .loginCard {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-float);
      box-shadow: var(--elevation-2);
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .chatGrid {
      display: grid;
      grid-template-columns: 17rem minmax(0, 1fr);
      gap: var(--space-4);
      min-height: 34rem;
    }
    .chatListPane {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-float);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .chatThreadPane {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-float);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .msgStream {
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      max-height: 24rem;
      overflow-y: auto;
    }
    .msgBubble {
      max-width: 44rem;
      padding: var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .msgUser {
      align-self: flex-end;
      background: var(--surface-nested);
    }
    .sourceBox {
      padding: var(--space-2) var(--space-3);
      background: var(--surface-sunken);
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-subtle);
      font-size: var(--text-xs);
    }
    .errorBanner {
      padding: var(--space-4);
      border-radius: var(--radius-md);
      background: var(--error-soft);
      border: 1px solid var(--error);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .emptyBox {
      padding: var(--space-7) var(--space-4);
      text-align: center;
      background: var(--surface-nested);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }
    .skeletonBlock {
      height: 8rem;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      animation: pulse 1.2s infinite;
    }
    .modalOverlay {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      z-index: 950;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .modalOverlay.open {
      display: flex;
    }
    .modalCard {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-float);
      box-shadow: var(--elevation-3);
      padding: var(--space-5);
      max-width: 32rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .toastRegion {
      position: fixed;
      right: var(--space-4);
      bottom: var(--space-4);
      z-index: 980;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .toastItem {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      background: var(--surface-raised);
      border: 1px solid var(--ok);
      box-shadow: var(--elevation-3);
      font-size: var(--text-xs);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    @media (max-width: 1024px) {
      .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid3, .grid2, .splitMasterDetail, .loginSplit, .chatGrid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar.mobileOpen {
        display: flex;
        position: fixed;
        inset: var(--space-3);
        z-index: 920;
        height: auto;
      }
      .mobileBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        margin: var(--space-2) var(--gap-float) 0;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-float);
      }
      input, select, textarea { font-size: 16px !important; }
    }

    /* ==========================================================================
       6. DIALOG MODAL & TOASTS & LOGIN OVERLAY
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 12, 29, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: min(520px, 100%);
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-float);
      box-shadow: var(--elevation-3);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* Login Hero Layout: text on left, form on right */
    .login-hero-card {
      width: min(820px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: var(--space-6);
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-float);
      box-shadow: var(--elevation-3);
      padding: var(--space-6);
    }

    .toast-stack {
      position: fixed;
      bottom: var(--float-gap);
      right: var(--float-gap);
      z-index: 95;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: var(--text-xs);
      font-weight: 700;
      box-shadow: var(--elevation-3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 960px) {
      .hud-wing-dock {
        width: 200px;
      }
      .hud-feature-panel {
        width: calc(100vw - 232px);
      }
      #list-view-container {
        padding-left: 224px;
      }
    }
    @media (max-width: 720px) {
      .hud-wing-dock {
        display: none;
      }
      .hud-feature-panel {
        left: var(--float-gap);
        width: calc(100vw - 32px);
        top: 124px;
      }
      #list-view-container {
        padding-left: var(--float-gap);
        padding-top: 124px;
      }
      .chat-split, .login-hero-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <a href="#main-panel-focus" class="skip-link">Skip to active console panel</a>

  <div id="app-root">
    <!-- 3D Sims 4 Build Mode Viewport -->
    <div id="webgl-container" role="region" aria-label="ITI AI Headquarters 3D Isometric Building"></div>

    <!-- Keyboard-Navigable 3D Room Hotspots (WCAG 2.2 AA) -->
    <div id="hotspot-layer" role="group" aria-label="3D Headquarters Room Hotspots"></div>

    <!-- Top Floating HUD Bar -->
    <header class="hud-top-bar" role="banner">
      <div class="hud-card brand-bar">
        <div class="brand-mark" aria-hidden="true">ITI</div>
        <div class="brand-title-wrap">
          <span class="brand-title">ITI AI Console · 3D HQ</span>
          <span class="brand-subtitle">Intellismart Technology Inc. · Asia/Manila</span>
        </div>
        <button type="button" id="beacon-status-btn" class="beacon-pill ok" title="Click to cycle live roof beacon state (Healthy / Degraded / Error)">
          <span class="beacon-dot" aria-hidden="true"></span>
          <span id="beacon-status-label">● Healthy · All systems nominal</span>
        </button>
      </div>

      <!-- Fixed HUD Corner Card: Account Block, Role Switcher, List View Fallback, Theme, Reduced Motion, Log out -->
      <div class="hud-card account-bar" role="navigation" aria-label="Account and View Controls">
        <button type="button" id="toggle-view-mode-btn" class="btn btn-primary" aria-pressed="false">
          <span id="toggle-view-mode-label">☰ Switch to List View</span>
        </button>

        <label for="role-select" style="font-size:var(--text-xs);color:var(--text-subtle);font-weight:700;">Role:</label>
        <select id="role-select" class="select input-sm" aria-label="Simulate ITI Staff Role">
          <option value="super_admin">Vince · Super Admin</option>
          <option value="supervisor">Clara · Supervisor</option>
          <option value="tester">Marco · Tester (Chat only)</option>
        </select>

        <button type="button" id="theme-toggle-btn" class="btn" aria-label="Toggle Dark and Light Theme">
          <span id="theme-toggle-label">☀ Light Paper</span>
        </button>

        <button type="button" id="motion-toggle-btn" class="btn" aria-pressed="false" title="Respects prefers-reduced-motion: instant camera cuts & zero idle animations">
          <span id="motion-toggle-label">Motion: Smooth</span>
        </button>

        <button type="button" id="login-modal-btn" class="btn" title="Preview /login screen & sign out">
          ⎋ Log out
        </button>
      </div>
    </header>

    <!-- Left Floating Navigation Dock Toggle Button (shown when sidebar is collapsed) -->
    <button type="button" class="hud-card wing-dock-toggle-btn" id="wing-dock-toggle-btn" aria-expanded="false" title="Open HQ Wings navigation sidebar">
      <span>☰ HQ Wings</span>
      <span aria-hidden="true">›</span>
    </button>

    <!-- Left Floating Navigation Dock (4 Wings = 4 Nav Groups, collapses when navigating 3D) -->
    <nav class="hud-card hud-wing-dock collapsed" aria-label="HQ Wings and Console Features" id="wing-dock-nav"></nav>

    <!-- Bottom Arrow-Up Button to Pop Up Camera & Instructions Bar -->
    <button type="button" class="hud-card cam-bar-expand-btn" id="cam-bar-expand-btn" aria-label="Pop up camera controls and instructions" title="Show camera controls & instructions">
      ▲
    </button>

    <!-- Bottom Sims 4 Build Mode Camera Control Bar (Collapsed when navigating) -->
    <div class="hud-card hud-camera-bar collapsed" id="hud-camera-bar" role="toolbar" aria-label="Sims 4 Build Mode Camera Controls">
      <button type="button" class="btn" id="cam-bar-collapse-btn" title="Collapse bottom bar">▼</button>
      <button type="button" class="btn" id="cam-orbit-left" title="Orbit -45° (Shortcut: Q)">↺ Orbit Q</button>
      <button type="button" class="btn" id="cam-orbit-right" title="Orbit +45° (Shortcut: E)">↻ Orbit E</button>
      <button type="button" class="btn" id="cam-tilt-up" title="Tilt Higher +4° (Shortcut: R)">▲ Tilt R</button>
      <button type="button" class="btn" id="cam-tilt-down" title="Tilt Lower -4° (Shortcut: F)">▼ Tilt F</button>
      <button type="button" class="btn" id="cam-zoom-in" title="Zoom In (Wheel Up)">＋ Zoom</button>
      <button type="button" class="btn" id="cam-zoom-out" title="Zoom Out (Wheel Down)">－ Zoom</button>
      <button type="button" class="btn btn-primary" id="cam-cursor-nav-btn" title="Cycle navigation mode: Tap to Move Xia (Camera Follows) / Tap to Move Xia (Free Cam) / Cursor Follow">🏃 Tap to Move: Xia (Cam Follows)</button>
      <button type="button" class="btn" id="cam-walls-btn" title="Cycle Sims 4 Cutaway Walls mode">Walls: Auto Cutaway</button>
      <button type="button" class="btn btn-primary" id="cam-reset-home" title="Reset Camera to Default Sims Build View (Shortcut: Home)">⌂ Reset (Home)</button>
      <span class="cam-readout" id="cam-telemetry-readout">FOV 32° · Pitch 42° · Yaw 45° · Dist 28.0m</span>
    </div>

    <!-- Right Floating HUD Feature Panel (3D Mode) -->
    <aside class="hud-card hud-feature-panel" id="hud-feature-panel" aria-live="polite">
      <div class="panel-header">
        <div>
          <div class="breadcrumbs" id="hud-breadcrumbs"></div>
          <h1 class="panel-title" id="main-panel-focus" tabindex="-1">Overview</h1>
          <p class="panel-desc" id="hud-panel-desc"></p>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button type="button" class="btn" id="hud-focus-3d-btn" title="Focus 3D camera on this room">◎ Focus Room</button>
          <button type="button" class="btn" id="hud-minimize-btn" title="Minimize HUD panel to inspect full 3D building">✕ Hide HUD</button>
        </div>
      </div>
      <div id="hud-security-gate-slot"></div>
      <div class="panel-body" id="hud-panel-body"></div>
    </aside>

    <!-- Accessible List-View Container (Interactive Visual Redesign Layout) -->
    <div id="list-view-container" role="region" aria-label="Accessible List View Console">
      <!-- Hidden sync slots used by 3D HUD panel renderer -->
      <div style="display:none" aria-hidden="true">
        <div id="list-breadcrumbs"></div>
        <div id="list-panel-title"></div>
        <div id="list-panel-desc"></div>
        <div id="list-security-gate-slot"></div>
        <div id="list-panel-body"></div>
      </div>

      <!-- Interactive Prototype Inspector Bar -->
      <div class="protoDock" role="region" aria-label="Visual Prototype Controls">
        <div class="protoGroup">
          <button type="button" id="lv-back-to-3d-btn" class="btnPrimary">
            ◧ Switch to 3D HQ View
          </button>
          <span class="protoLabel">Interactive Redesign Preview</span>
          <label>
            Page:
            <select id="ctrl-page" class="protoSelect" aria-label="Select page">
              <option value="overview">1. Overview (/)</option>
              <option value="login">0. Login (/login)</option>
              <option value="performance">2. Performance (/performance)</option>
              <option value="requests">3. Request log (/requests)</option>
              <option value="documents">4. Documents (/documents)</option>
              <option value="chat">5. Chat (/chat)</option>
              <option value="companies">6. Companies (/companies)</option>
              <option value="apps">7. Apps &amp; keys (/apps)</option>
              <option value="users">8. Users &amp; chats (/users — 3 levels)</option>
              <option value="accounts">9. Accounts (/accounts)</option>
              <option value="tools">10. Tools &amp; MCP (/tools — 6 tabs)</option>
            </select>
          </label>

          <label>
            Role:
            <select id="ctrl-role" class="protoSelect" aria-label="Select staff role">
              <option value="super_admin">super admin (All groups)</option>
              <option value="supervisor">supervisor (No Admin group)</option>
              <option value="tester">tester (Chat only)</option>
            </select>
          </label>

          <label>
            View State:
            <select id="ctrl-state" class="protoSelect" aria-label="Select page state">
              <option value="populated">Populated (Normal)</option>
              <option value="loading">Loading (Skeleton)</option>
              <option value="empty">Empty State</option>
              <option value="error4xx">Error 4xx (FastAPI message)</option>
              <option value="error5xx">Error 5xx (Generic + request_id)</option>
            </select>
          </label>
        </div>

        <div class="protoGroup">
          <button type="button" id="ctrl-theme-btn" class="btnSecondary">
            ☀ Switch to Light (Paper)
          </button>
        </div>
      </div>

      <!-- Mobile Top Bar -->
      <header class="mobileBar" id="mobile-top-bar">
        <div class="protoGroup">
          <span class="brandMark">ITI</span>
          <strong>ITI AI Console</strong>
        </div>
        <button type="button" id="mobile-menu-btn" class="btnSecondary">Menu</button>
      </header>

      <!-- Main Shell Container -->
      <div id="shell-container" class="shell">
        <!-- Floating Sidebar -->
        <aside id="sidebar-nav" class="sidebar" aria-label="Console navigation">
