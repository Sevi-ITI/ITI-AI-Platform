    /* ==========================================================================
       3. THE SIMS 4 BUILD MODE CAMERA CONTROLLER MODULE
       ========================================================================== */
    const SIMS_CAMERA_DEFAULTS = {
      fov: 32,                 // Long focal length, low-distortion simulation look
      defaultPitchDeg: 42,     // Oblique 3/4 downward angle (35–50° sweet spot)
      minPitchDeg: 30,         // Prevents camera flipping under floor
      maxPitchDeg: 60,         // Prevents strict orthographic gimbal lock
      defaultYawDeg: 45,       // Classic isometric 45° corner orientation
      yawStepDeg: 45,          // Discrete Q/E rotation step
      defaultDistance: 28.0,   // Full building overview distance
      minDistance: 12.0,       // Close-up room inspection without clipping
      maxDistance: 64.0,       // Compound + highway & parkland overview
      focusDistance: 14.2,     // Zoomed-in station focus distance
      panLimit: 24.0,          // Bounds [-24, 24] on X and Z
      panSpeed: 14.0,          // WASD meters/sec
      damping: 10.0,           // Smooth exponential decay
      minCameraY: 2.5          // Hard floor clearance
    };

    class SimsBuildCameraController {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;
        this.cfg = { ...SIMS_CAMERA_DEFAULTS };

        this.targetFocus = new THREE.Vector3(0, 0, 0);
        this.currentFocus = new THREE.Vector3(0, 0, 0);

        const deg2rad = Math.PI / 180;
        this.targetYaw = this.cfg.defaultYawDeg * deg2rad;
        this.currentYaw = this.targetYaw;
        this.targetPitch = this.cfg.defaultPitchDeg * deg2rad;
        this.currentPitch = this.targetPitch;
        this.targetDist = this.cfg.defaultDistance;
        this.currentDist = this.targetDist;

        this.keys = new Set();
        this.isOrbitDragging = false;
        this.isPanDragging = false;
        this.lastPtr = { x: 0, y: 0 };
        this.cursorNdc = new THREE.Vector2(0, 0);
        this.cursorActiveOnCanvas = false;
        this.cursorFloorHit = new THREE.Vector3(0, 0, 0);
        this.raycaster = new THREE.Raycaster();
        this.floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        this.bindEvents();
        this.syncCameraMatrix();
      }

      clamp() {
        const deg2rad = Math.PI / 180;
        this.targetPitch = THREE.MathUtils.clamp(
          this.targetPitch,
          this.cfg.minPitchDeg * deg2rad,
          this.cfg.maxPitchDeg * deg2rad
        );
        this.targetDist = THREE.MathUtils.clamp(
          this.targetDist,
          this.cfg.minDistance,
          this.cfg.maxDistance
        );
        this.targetFocus.x = THREE.MathUtils.clamp(this.targetFocus.x, -this.cfg.panLimit, this.cfg.panLimit);
        this.targetFocus.z = THREE.MathUtils.clamp(this.targetFocus.z, -this.cfg.panLimit, this.cfg.panLimit);
        this.targetFocus.y = 0;
      }

      orbitStep(dir) {
        this.targetYaw += dir * (this.cfg.yawStepDeg * Math.PI / 180);
        if (state.reducedMotion) this.currentYaw = this.targetYaw;
      }

      tiltStep(deltaDeg) {
        this.targetPitch += deltaDeg * (Math.PI / 180);
        this.clamp();
        if (state.reducedMotion) this.currentPitch = this.targetPitch;
      }

      zoomStep(factor) {
        this.targetDist *= factor;
        this.clamp();
        if (state.reducedMotion) this.currentDist = this.targetDist;
      }

      focusStation(posArray) {
        // Offset camera targetFocus along camera-right so the zoomed-in station sits to the LEFT of screen center
        // (framed in the open left viewport area since the left sidebar is collapsed and the right HUD panel is open)
        const rightX = Math.cos(this.targetYaw);
        const rightZ = -Math.sin(this.targetYaw);
        const leftShiftOffset = state.hudMinimized ? 0.8 : 3.4;
        this.targetFocus.set(
          posArray[0] + rightX * leftShiftOffset,
          0,
          posArray[2] + rightZ * leftShiftOffset
        );
        this.targetDist = this.cfg.focusDistance;
        this.clamp();
        if (state.reducedMotion) {
          this.currentFocus.copy(this.targetFocus);
          this.currentDist = this.targetDist;
        }
      }

      resetHome() {
        const deg2rad = Math.PI / 180;
        this.targetFocus.set(0, 0, 0);
        this.targetYaw = this.cfg.defaultYawDeg * deg2rad;
        this.targetPitch = this.cfg.defaultPitchDeg * deg2rad;
        this.targetDist = this.cfg.defaultDistance;
        this.clamp();
        if (state.reducedMotion) {
          this.currentFocus.copy(this.targetFocus);
          this.currentYaw = this.targetYaw;
          this.currentPitch = this.targetPitch;
          this.currentDist = this.targetDist;
        }
      }

      zoomTowardCursor(deltaY, clientX, clientY) {
        const rect = this.domElement.getBoundingClientRect();
        const ndc = new THREE.Vector2(
          ((clientX - rect.left) / rect.width) * 2 - 1,
          -((clientY - rect.top) / rect.height) * 2 + 1
        );
        this.raycaster.setFromCamera(ndc, this.camera);
        const hit = new THREE.Vector3();
        const intersected = this.raycaster.ray.intersectPlane(this.floorPlane, hit);

        const prevDist = this.targetDist;
        const factor = deltaY > 0 ? 1.11 : 0.90;
        this.targetDist = THREE.MathUtils.clamp(prevDist * factor, this.cfg.minDistance, this.cfg.maxDistance);

        if (intersected && deltaY < 0) {
          const pull = (1 - this.targetDist / prevDist) * 0.42;
          this.targetFocus.lerp(new THREE.Vector3(hit.x, 0, hit.z), pull);
        }
        this.clamp();
        if (state.reducedMotion) {
          this.currentDist = this.targetDist;
          this.currentFocus.copy(this.targetFocus);
        }
      }

      update(dt) {
        // Keyboard WASD / Arrow panning along camera-relative horizontal vectors
        const forward = new THREE.Vector3(-Math.sin(this.currentYaw), 0, -Math.cos(this.currentYaw)).normalize();
        const right = new THREE.Vector3(Math.cos(this.currentYaw), 0, -Math.sin(this.currentYaw)).normalize();
        const move = new THREE.Vector3();

        if (this.keys.has('KeyW') || this.keys.has('ArrowUp')) move.add(forward);
        if (this.keys.has('KeyS') || this.keys.has('ArrowDown')) move.sub(forward);
        if (this.keys.has('KeyD') || this.keys.has('ArrowRight')) move.add(right);
        if (this.keys.has('KeyA') || this.keys.has('ArrowLeft')) move.sub(right);

        // Cursor-driven 3D plane navigation when moving cursor over the 3D canvas
        if (this.cursorActiveOnCanvas && !this.isOrbitDragging && !this.isPanDragging) {
          if (state.cursorNavMode === 'follow') {
            // Smoothly steer across the 3D plane toward the cursor offset
            const deadzone = 0.12;
            const nx = Math.abs(this.cursorNdc.x) > deadzone ? this.cursorNdc.x : 0;
            const ny = Math.abs(this.cursorNdc.y) > deadzone ? this.cursorNdc.y : 0;
            if (nx !== 0 || ny !== 0) {
              const cursorFollowSpeed = this.cfg.panSpeed * 0.85;
              const steer = new THREE.Vector3()
                .addScaledVector(right, nx * cursorFollowSpeed * dt)
                .addScaledVector(forward, ny * cursorFollowSpeed * dt);
              this.targetFocus.add(steer);
              this.clamp();
            }
          } else if (state.cursorNavMode === 'edge') {
            const edgeThreshold = 0.80;
            if (this.cursorNdc.x > edgeThreshold) move.add(right);
            if (this.cursorNdc.x < -edgeThreshold) move.sub(right);
            if (this.cursorNdc.y > edgeThreshold) move.add(forward);
            if (this.cursorNdc.y < -edgeThreshold) move.sub(forward);
          }
        }

        if (move.lengthSq() > 0) {
          move.normalize().multiplyScalar(this.cfg.panSpeed * dt);
          this.targetFocus.add(move);
          this.clamp();
        }

        if (state.reducedMotion) {
          this.currentFocus.copy(this.targetFocus);
          this.currentYaw = this.targetYaw;
          this.currentPitch = this.targetPitch;
          this.currentDist = this.targetDist;
        } else {
          const alpha = 1 - Math.exp(-this.cfg.damping * dt);
          this.currentFocus.lerp(this.targetFocus, alpha);
          this.currentYaw = THREE.MathUtils.lerp(this.currentYaw, this.targetYaw, alpha);
          this.currentPitch = THREE.MathUtils.lerp(this.currentPitch, this.targetPitch, alpha);
          this.currentDist = THREE.MathUtils.lerp(this.currentDist, this.targetDist, alpha);
        }

        this.syncCameraMatrix();
      }

      syncCameraMatrix() {
        const hDist = this.currentDist * Math.cos(this.currentPitch);
        const vDist = Math.max(this.cfg.minCameraY, this.currentDist * Math.sin(this.currentPitch));

        this.camera.position.set(
          this.currentFocus.x + hDist * Math.sin(this.currentYaw),
          this.currentFocus.y + vDist,
          this.currentFocus.z + hDist * Math.cos(this.currentYaw)
        );
        this.camera.lookAt(this.currentFocus);

        if (!this._readoutEl) this._readoutEl = document.getElementById('cam-telemetry-readout');
        if (this._readoutEl) {
          const pitchDeg = Math.round((this.currentPitch * 180) / Math.PI);
          const yawDeg = (((Math.round((this.currentYaw * 180) / Math.PI) % 360) + 360) % 360);
          const str = `FOV ${this.cfg.fov}° · Pitch ${pitchDeg}° · Yaw ${yawDeg}° · Dist ${this.currentDist.toFixed(1)}m`;
          if (this._lastTelemetryStr !== str) {
            this._lastTelemetryStr = str;
            this._readoutEl.textContent = str;
          }
        }
      }

      bindEvents() {
        window.addEventListener('keydown', (e) => {
          const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
          if (document.getElementById('modal-backdrop').classList.contains('open')) {
            if (e.code === 'Escape') closeModal();
            return;
          }

          this.keys.add(e.code);
          if (e.code === 'KeyQ') { e.preventDefault(); this.orbitStep(-1); }
          else if (e.code === 'KeyE') { e.preventDefault(); this.orbitStep(1); }
          else if (e.code === 'KeyR') { e.preventDefault(); this.tiltStep(4); }
          else if (e.code === 'KeyF') { e.preventDefault(); this.tiltStep(-4); }
          else if (e.code === 'Home') { e.preventDefault(); this.resetHome(); }
        });

        window.addEventListener('keyup', (e) => {
          this.keys.delete(e.code);
        });

        this.domElement.addEventListener('pointerdown', (e) => {
          this.lastPtr = { x: e.clientX, y: e.clientY };
          if (typeof collapseHudBarsOnNavigate === 'function') collapseHudBarsOnNavigate();
          if (e.button === 2 || (e.button === 0 && e.altKey)) {
            this.isOrbitDragging = true;
          } else if (e.button === 0 || e.button === 1) {
            // Left-drag or Middle-drag directly grabs and pans the 3D plane
            this.isPanDragging = true;
          }
        });

        this.domElement.addEventListener('pointerenter', () => {
          this.cursorActiveOnCanvas = true;
        });

        this.domElement.addEventListener('pointerleave', () => {
          this.cursorActiveOnCanvas = false;
        });

        const _rayHit = new THREE.Vector3();
        window.addEventListener('pointermove', (e) => {
          if (state.viewMode === 'list') return;
          const onCanvas = (e.target === this.domElement);
          this.cursorActiveOnCanvas = onCanvas;
          if (!onCanvas && !this.isOrbitDragging && !this.isPanDragging) return;

          const w = viewportW || window.innerWidth || 1;
          const h = viewportH || window.innerHeight || 1;
          this.cursorNdc.set(
            (e.clientX / w) * 2 - 1,
            -(e.clientY / h) * 2 + 1
          );

          if (onCanvas && !this.isOrbitDragging && !this.isPanDragging) {
            this.raycaster.setFromCamera(this.cursorNdc, this.camera);
            if (this.raycaster.ray.intersectPlane(this.floorPlane, _rayHit)) {
              this.cursorFloorHit.set(
                THREE.MathUtils.clamp(_rayHit.x, -this.cfg.panLimit, this.cfg.panLimit),
                0.15,
                THREE.MathUtils.clamp(_rayHit.z, -this.cfg.panLimit, this.cfg.panLimit)
              );
              if (cursorReticleMesh) {
                cursorReticleMesh.position.copy(this.cursorFloorHit);
                cursorReticleMesh.visible = true;
              }
            }
          }
          const dx = e.clientX - this.lastPtr.x;
          const dy = e.clientY - this.lastPtr.y;
          this.lastPtr = { x: e.clientX, y: e.clientY };

          if (this.isOrbitDragging) {
            this.targetYaw -= dx * 0.0065;
            this.targetPitch += dy * 0.0045;
            this.clamp();
            if (state.reducedMotion) {
              this.currentYaw = this.targetYaw;
              this.currentPitch = this.targetPitch;
            }
          } else if (this.isPanDragging) {
            const scale = this.currentDist * 0.0014;
            const right = new THREE.Vector3(Math.cos(this.currentYaw), 0, -Math.sin(this.currentYaw));
            const forward = new THREE.Vector3(-Math.sin(this.currentYaw), 0, -Math.cos(this.currentYaw));
            this.targetFocus.addScaledVector(right, -dx * scale);
            this.targetFocus.addScaledVector(forward, dy * scale);
            this.clamp();
            if (state.reducedMotion) this.currentFocus.copy(this.targetFocus);
          }
        });

        window.addEventListener('pointerup', () => {
          this.isOrbitDragging = false;
          this.isPanDragging = false;
        });

        this.domElement.addEventListener('wheel', (e) => {
          e.preventDefault();
          if (typeof collapseHudBarsOnNavigate === 'function') collapseHudBarsOnNavigate();
          this.zoomTowardCursor(e.deltaY, e.clientX, e.clientY);
        }, { passive: false });

        this.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
      }
    }

        if (dist > 6) return;

        // Compute exact 3D floor intersection for tap-to-move
        const rect = renderer.domElement.getBoundingClientRect();
        const ndc = new THREE.Vector2(
          ((e.clientX - rect.left) / rect.width) * 2 - 1,
          -((e.clientY - rect.top) / rect.height) * 2 + 1
        );
        const ray = new THREE.Raycaster();
        ray.setFromCamera(ndc, camera);
        const floorHit = new THREE.Vector3();
        const hitFloor = ray.ray.intersectPlane(camCtrl.floorPlane, floorHit);

          const tx = THREE.MathUtils.clamp(floorHit.x, -camCtrl.cfg.panLimit, camCtrl.cfg.panLimit);

          commandXiaMoveTo(tx, tz, null);
        }
      });
      renderer.domElement.addEventListener('dblclick', (e) => {
        const stationId = pickStationFromEvent(e);
        if (stationId) {
          selectStation(stationId, true);
        }
      });

      window.addEventListener('resize', onWindowResize);
      syncSceneThemeAndRoles();
    }

    function pickStationFromEvent(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const ndc = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(interactiveMeshes, true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && !obj.userData?.stationId) {
          obj = obj.parent;
        }
        return obj?.userData?.stationId || null;
      }
      return null;
    }

        }

      interactiveMeshes.push(group);
      scene.add(group);
    }

    function commandXiaMoveTo(targetX, targetZ, stationId = null) {
      // Check role restrictions on target coordinates (Admin Engine Room is X > 0.5, Z > 0.5)
      if (state.role !== 'super_admin' && targetX > 0.4 && targetZ > 0.4) {
        showToast('Xia cannot enter the Engine Room: Super admin clearance required 🔒');
        return;
      }
      if (state.role === 'tester' && !(targetX > -0.5 && targetZ < 0.5)) {
        showToast('Tester role: Xia is restricted to the Knowledge Library wing 🔒');
        return;
      }

      state.xia.target.x = THREE.MathUtils.clamp(targetX, -9.4, 9.4);
      state.xia.target.z = THREE.MathUtils.clamp(targetZ, -9.4, 9.4);
      state.xia.pendingStationId = stationId;

      if (state.reducedMotion) {
        state.xia.pos.x = state.xia.target.x;
        state.xia.pos.z = state.xia.target.z;
        state.xia.isMoving = false;
        if (xiaGroup) xiaGroup.position.set(state.xia.pos.x, 0.14, state.xia.pos.z);
        if (xiaTargetMarker) xiaTargetMarker.visible = false;
        if (state.cursorNavMode === 'tap_follow' && camCtrl) {
          camCtrl.targetFocus.set(state.xia.pos.x, 0, state.xia.pos.z);
          camCtrl.clamp();
          camCtrl.currentFocus.copy(camCtrl.targetFocus);
        }
        return;
      }

      state.xia.isMoving = true;
      if (xiaTargetMarker) {
        xiaTargetMarker.position.set(state.xia.target.x, 0.16, state.xia.target.z);
        xiaTargetMarker.visible = true;
      }
    }

    function updateXiaCharacter(dt, now) {
      if (!xiaGroup) return;
      const t = now * 0.001;

      if (xiaLimbs.plumbob && !state.reducedMotion) {
        xiaLimbs.plumbob.rotation.y = t * 2.2;
        xiaLimbs.plumbob.position.y = 1.68 + Math.sin(t * 3.5) * 0.05;
      }

      if (state.xia.isMoving) {
        const dx = state.xia.target.x - state.xia.pos.x;
        const dz = state.xia.target.z - state.xia.pos.z;
        const dist = Math.hypot(dx, dz);

        if (dist < 0.12) {
          state.xia.pos.x = state.xia.target.x;
          state.xia.pos.z = state.xia.target.z;
          state.xia.isMoving = false;
          if (xiaTargetMarker) xiaTargetMarker.visible = false;
          if (xiaLimbs.leftLeg) xiaLimbs.leftLeg.rotation.x = 0;
          if (xiaLimbs.rightLeg) xiaLimbs.rightLeg.rotation.x = 0;
          if (xiaLimbs.leftArm) xiaLimbs.leftArm.rotation.x = 0;
          if (xiaLimbs.rightArm) xiaLimbs.rightArm.rotation.x = 0;
          if (xiaLimbs.body) xiaLimbs.body.position.y = 0;

          state.xia.pendingStationId = null;
          // Check if Xia arrived near a console station
          const nearSt = STATIONS.find((st) => Math.hypot(st.pos[0] - state.xia.pos.x, st.pos[2] - state.xia.pos.z) < 2.1);
          if (nearSt && isStationAllowedForRole(nearSt, state.role) && state.activeStation !== nearSt.id) {
            selectStation(nearSt.id, false);
            showToast(`Xia arrived at ${nearSt.title}`);
          }
        } else {
          const step = Math.min(dist, state.xia.speed * dt);
          state.xia.pos.x += (dx / dist) * step;
          state.xia.pos.z += (dz / dist) * step;

          // Smoothly rotate Xia to face walking direction
          const desiredYaw = Math.atan2(dx, dz);
          let diff = desiredYaw - state.xia.yaw;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          state.xia.yaw += diff * Math.min(1, dt * 14);
          xiaGroup.rotation.y = state.xia.yaw;

          // Walk cycle limb swing & bounce
          state.xia.walkTime += dt * 13;
          const swing = Math.sin(state.xia.walkTime) * 0.65;
          if (xiaLimbs.leftLeg) xiaLimbs.leftLeg.rotation.x = swing;
          if (xiaLimbs.rightLeg) xiaLimbs.rightLeg.rotation.x = -swing;
          if (xiaLimbs.leftArm) xiaLimbs.leftArm.rotation.x = -swing * 0.8;
          if (xiaLimbs.rightArm) xiaLimbs.rightArm.rotation.x = swing * 0.8;
          if (xiaLimbs.body) xiaLimbs.body.position.y = Math.abs(Math.sin(state.xia.walkTime)) * 0.07;

          // Pulse waypoint marker
          if (xiaTargetMarker) {
            xiaTargetMarker.rotation.y = t * 3.0;
          }
        }

        xiaGroup.position.set(state.xia.pos.x, 0.14, state.xia.pos.z);

        // If camera is set to follow Xia on manual floor tap, glide camera target with her (framed slightly left when HUD panel is open)
        if (state.cursorNavMode === 'tap_follow' && !state.xia.pendingStationId && camCtrl && !camCtrl.isPanDragging) {
          const rightX = Math.cos(camCtrl.targetYaw);
          const rightZ = -Math.sin(camCtrl.targetYaw);
          const shift = state.hudMinimized ? 0.5 : 2.8;
          camCtrl.targetFocus.set(state.xia.pos.x + rightX * shift, 0, state.xia.pos.z + rightZ * shift);
          camCtrl.clamp();
        }
      }
    }

    function updateHighwayTraffic(dt) {
      if (state.reducedMotion) return;
      for (let i = 0; i < highwayVehicles.length; i++) {
        const v = highwayVehicles[i];
        if (v.axis === 'x') {
          v.mesh.position.x += v.dir * v.speed * dt;
          if (v.dir > 0 && v.mesh.position.x > 48) v.mesh.position.x = -48;
          if (v.dir < 0 && v.mesh.position.x < -48) v.mesh.position.x = 48;
        } else {
          v.mesh.position.z += v.dir * v.speed * dt;
          if (v.dir > 0 && v.mesh.position.z > 48) v.mesh.position.z = -48;
          if (v.dir < 0 && v.mesh.position.z < -48) v.mesh.position.z = 48;
        }
      }
    }

    function syncSceneThemeAndRoles() {
      if (!scene) return;
      const isDark = state.theme === 'dark';
      scene.background = new THREE.Color(isDark ? 0x0a1128 : 0xe8e2d5);

      if (scene.userData.plinthMat) {
        scene.userData.plinthMat.color.setHex(isDark ? 0x111a34 : 0xe5dfd3);
      }
      if (scene.userData.gridHelperDark && scene.userData.gridHelperLight) {
        scene.userData.gridHelperDark.visible = isDark;
        scene.userData.gridHelperLight.visible = !isDark;
      }
      if (scene.userData.hubMat) {
        scene.userData.hubMat.color.setHex(isDark ? 0x1e2b52 : 0xe2dacb);
      }
      if (scene.userData.pylonMat) {
        scene.userData.pylonMat.color.setHex(isDark ? 0x26335e : 0xcbbfa8);
      }

      // Sync all Cutaway Walls & Interior Wing Dividers so Light Mode has zero blue walls/dividers
      const wallHex = isDark ? 0x202d56 : 0xded6c6;
      for (let i = 0; i < cutawayWalls.length; i++) {
        cutawayWalls[i].material.color.setHex(wallHex);
      }

      // Sync surrounding Grass, Lawns, Highways & Dividers to theme
      if (envThemeMats.grassBase) envThemeMats.grassBase.color.setHex(isDark ? 0x0f261e : 0x88b578);
      if (envThemeMats.lawn) envThemeMats.lawn.color.setHex(isDark ? 0x16382c : 0x99c488);
      if (envThemeMats.sidewalk) envThemeMats.sidewalk.color.setHex(isDark ? 0x1d2842 : 0xdfd7c6);
      if (envThemeMats.road) envThemeMats.road.color.setHex(isDark ? 0x141b2d : 0x727882);
      if (envThemeMats.divider) envThemeMats.divider.color.setHex(isDark ? 0x26324d : 0xd4ccb8);
      if (envThemeMats.dash) envThemeMats.dash.color.setHex(isDark ? 0xe9b25c : 0xfffdf8);
      if (envThemeMats.foliage1) envThemeMats.foliage1.color.setHex(isDark ? 0x28664b : 0x468956);
      if (envThemeMats.foliage2) envThemeMats.foliage2.color.setHex(isDark ? 0x3b855f : 0x5ca16b);

      // Sync all 3D station furniture bases & indigo accents so nothing remains dark navy blue in Light Mode
      const darkBlueSet = new Set([0x263563, 0x223059, 0x2e3f73, 0x2b3a6b, 0x283868, 0x2c3d70, 0x243461, 0x24325c, 0x263663, 0x293766, 0x23305a, 0x17213f]);
      interactiveMeshes.forEach((grp) => {
        grp.traverse((child) => {
          if (child.isMesh && child.material && child.material.color) {
            if (child.userData.origHex === undefined) {
              child.userData.origHex = child.material.color.getHex();
            }
            const orig = child.userData.origHex;
            if (darkBlueSet.has(orig)) {
              child.material.color.setHex(isDark ? orig : 0xd6cbb8);
            } else if (orig === 0x6e76f0) {
              child.material.color.setHex(isDark ? 0x6e76f0 : 0x9a6b12);
            }
          }
        });
      });

      const accentHex = isDark ? 0x6e76f0 : 0x9a6b12;
      Object.entries(stationHighlightRings).forEach(([id, ringMesh]) => {
        const isCurrent = state.activeStation === id;
        ringMesh.material.color.setHex(accentHex);
        ringMesh.material.opacity = isCurrent ? 0.92 : 0.22;
        ringMesh.scale.setScalar(isCurrent ? 1.14 : 1.0);
      });

      // Role rules in 3D:
      // Tester sees only Library (Knowledge wing); Supervisor sees all except Admin Engine Room
      Object.entries(wingFloorMeshes).forEach(([wingId, mesh]) => {
        const baseHex = isDark ? mesh.userData.wingColorDark : mesh.userData.wingColorLight;
        let allowed = true;
        if (state.role === 'tester' && wingId !== 'knowledge') allowed = false;
        if (state.role === 'supervisor' && wingId === 'admin') allowed = false;
        mesh.material.color.setHex(allowed ? baseHex : (isDark ? 0x070c1d : 0xd8d3c8));
      });

      if (adminBlastDoorMesh) {
        adminBlastDoorMesh.visible = state.role !== 'super_admin';
      }

      // Sync MCP pipes & Tool valves in 3D
      mcpPipeMeshes.forEach(({ mesh, idx }) => {
        const conn = state.mcpConnections[idx];
        const up = conn && conn.state === 'Connected';
        mesh.material.color.setHex(up ? 0x5cc98f : (isDark ? 0x4a5568 : 0xb8afa0));
        mesh.material.emissive.setHex(up ? 0x5cc98f : (isDark ? 0x111a34 : 0xd8cfc0));
        mesh.material.emissiveIntensity = up ? 0.65 : 0.05;
      });

      toolValveMeshes.forEach(({ mesh, idx }) => {
        const tl = state.toolsList[idx];
        const on = tl && tl.enabled;
        mesh.material.color.setHex(on ? accentHex : 0xf07c7c);
        mesh.material.emissive.setHex(on ? accentHex : 0xb3261e);
        mesh.material.emissiveIntensity = on ? 0.5 : 0.2;
      });

      // Roof Beacon Color
      if (roofBeaconMesh && roofBeaconRing) {
        const bHex = state.beaconState === 'ok' ? 0x5cc98f : (state.beaconState === 'warn' ? 0xe9b25c : 0xf07c7c);
        roofBeaconMesh.material.color.setHex(bHex);
        roofBeaconMesh.material.emissive.setHex(bHex);
        roofBeaconRing.material.color.setHex(bHex);
        roofBeaconRing.material.emissive.setHex(bHex);
      }
    }

    function updateCutawayWalls() {
      _camDirVec.subVectors(camera.position, camCtrl.currentFocus).setY(0).normalize();

      for (let i = 0; i < cutawayWalls.length; i++) {
        const wall = cutawayWalls[i];
        let cut = false;
        if (state.wallMode === 'down') {
          cut = true;
        } else if (state.wallMode === 'up') {
          cut = false;
        } else {
          const dot = wall.userData.normal.dot(_camDirVec);
          cut = dot > 0.18;
        }
        const targetScaleY = cut ? 0.12 : 1.0;
        if (Math.abs(wall.scale.y - targetScaleY) > 0.002) {
          wall.scale.y = state.reducedMotion
            ? targetScaleY
            : THREE.MathUtils.lerp(wall.scale.y, targetScaleY, 0.18);
          wall.position.y = (wall.userData.fullH * wall.scale.y) * 0.5;
        }
      }
    }

    function updateHotspotProjections() {
      const w = viewportW;
      const h = viewportH;

      for (let i = 0; i < cachedHotspotEntries.length; i++) {
        const entry = cachedHotspotEntries[i];
        const st = entry.st;
        const btn = entry.btn;
        _projVec.set(st.pos[0], st.pos[1] + 0.7, st.pos[2]).project(camera);

        if (_projVec.z > 1) {
          if (entry.visible) {
            btn.style.display = 'none';
            entry.visible = false;
          }
          continue;
        }
        const rx = Math.round((_projVec.x * 0.5 + 0.5) * w);
        const ry = Math.round((-(_projVec.y * 0.5) + 0.5) * h);
        if (!entry.visible) {
          btn.style.display = 'inline-flex';
          entry.visible = true;
        }
        if (entry.lastX !== rx || entry.lastY !== ry) {
          entry.lastX = rx;
          entry.lastY = ry;
          btn.style.transform = `translate3d(${rx}px, ${ry}px, 0) translate(-50%, -100%)`;
        }
      }

      if (cachedXiaTag && xiaGroup) {
        _projVec.set(state.xia.pos.x, 2.05, state.xia.pos.z).project(camera);
        if (_projVec.z > 1) {
          if (cachedXiaTag._vis !== false) {
            cachedXiaTag.style.display = 'none';
            cachedXiaTag._vis = false;
          }
        } else {
          const xrx = Math.round((_projVec.x * 0.5 + 0.5) * w);
          const xry = Math.round((-(_projVec.y * 0.5) + 0.5) * h);
          if (cachedXiaTag._vis !== true) {
            cachedXiaTag.style.display = 'inline-flex';
            cachedXiaTag._vis = true;
          }
          if (cachedXiaTag._lx !== xrx || cachedXiaTag._ly !== xry) {
            cachedXiaTag._lx = xrx;
            cachedXiaTag._ly = xry;
            cachedXiaTag.style.transform = `translate3d(${xrx}px, ${xry}px, 0) translate(-50%, -100%)`;
          }
        }
      }
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      viewportW = window.innerWidth;
      viewportH = window.innerHeight;
      camera.aspect = viewportW / viewportH;
      camera.updateProjectionMatrix();
      renderer.setSize(viewportW, viewportH);
    }

    let lastFrameTime = performance.now();
    function animateLoop(now) {
      requestAnimationFrame(animateLoop);

      // Pause rendering when tab is hidden or List View fallback is active
      if (document.hidden || state.viewMode === 'list') {
        lastFrameTime = now;
        return;
      }

      const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
      lastFrameTime = now;

      updateXiaCharacter(dt, now);
      updateHighwayTraffic(dt);
      camCtrl.update(dt);
      updateCutawayWalls();

      // Gentle live world animation (respects prefers-reduced-motion)
      if (!state.reducedMotion) {
        const t = now * 0.001;
        if (roofBeaconRing) {
          roofBeaconRing.rotation.z = t * 1.4;
          const pulseScale = state.beaconState === 'ok' ? 1 + Math.sin(t * 2.5) * 0.06 : 1 + Math.sin(t * 6.0) * 0.16;
          roofBeaconRing.scale.setScalar(pulseScale);
        }
        liveScreenMeshes.forEach((scr, idx) => {
          scr.material.emissiveIntensity = 0.45 + 0.35 * Math.sin(t * 3.2 + idx * 1.7);
        });
        gaugeNeedles.forEach((ndl) => {
          ndl.rotation.z = Math.sin(t * 2.1 + ndl.userData.phase) * 0.55;
        });
      }

      renderer.render(scene, camera);
      updateHotspotProjections();
    }

    function isStationAllowedForRole(station, role) {
      return station.allowedRoles.includes(role);

    function buildHotspotButtons() {
      const layer = document.getElementById('hotspot-layer');
      layer.innerHTML = '';
      cachedHotspotEntries = [];
      STATIONS.forEach((st) => {
        const allowed = isStationAllowedForRole(st, state.role);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = `hotspot-btn-${st.id}`;
        btn.className = `hotspot-pin ${allowed ? 'ok' : 'locked'}`;
        btn.setAttribute('aria-current', state.activeStation === st.id ? 'true' : 'false');
        btn.innerHTML = `
          <span class="hotspot-wing-dot" aria-hidden="true"></span>
          <span>${escapeHtml(st.title)}</span>
          ${!allowed ? '<span aria-label="Locked for current role">🔒</span>' : ''}
        `;
        btn.addEventListener('click', () => selectStation(st.id, true));
        layer.appendChild(btn);
        cachedHotspotEntries.push({ st, btn, visible: true, lastX: -9999, lastY: -9999 });
      });

      const xiaTag = document.createElement('div');
      xiaTag.id = 'xia-floating-tag';
      xiaTag.className = 'xia-name-tag';
      xiaTag.innerHTML = `<span style="color:var(--ok)">◆</span> <span>Xia</span>`;

      if (toggleBtn) {
        toggleBtn.classList.toggle('hidden-tab', !collapsed);
        toggleBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');

      state.bottomBarCollapsed = collapsed;

    function selectStation(stationId, focus3D = true) {
      const st = STATIONS.find((s) => s.id === stationId);
      if (!st) return;

      if (!isStationAllowedForRole(st, state.role)) {
        const msg = st.wing === 'admin'
          ? 'Engine Room Locked: Super admin only.'
          : 'Restricted Wing: Testers only have access to the Library Reception Desk (Chat).';
        showToast(msg);
        return;
      }

      state.activeStation = stationId;
      state.hudMinimized = false;
      document.getElementById('hud-feature-panel').classList.remove('minimized');
      document.title = `${st.title} – ITI AI Console`;

      if (focus3D && state.viewMode === '3d') {
        collapseHudBarsOnNavigate();
        // Walk Xia to a spot right in front of the selected station
        const offsetX = st.pos[0] > 0 ? st.pos[0] - 1.1 : st.pos[0] + 1.1;
        const offsetZ = st.pos[2] > 0 ? st.pos[2] - 1.1 : st.pos[2] + 1.1;
        commandXiaMoveTo(offsetX, offsetZ, st.id);
        if (camCtrl) camCtrl.focusStation(st.pos);
      }

      buildHotspotButtons();
      renderNavigationDock();
      syncSceneThemeAndRoles();
      renderActivePanel();
    }

       -------------------------------------------------------------------------- */
    function renderDocumentsPanel(container) {
      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <span style="font-size:var(--text-sm);color:var(--text-muted);">

          </span>
          <button type="button" class="btn btn-primary" id="doc-upload-open-btn">＋ Upload PDF to Collection</button>
        </div>

        ${state.collections.map((col) => `
          <div class="section-box">
            <div class="section-header">
              <div>
                <h2 class="section-title">${escapeHtml(col.name)} <span class="mono" style="font-size:var(--text-xs);color:var(--text-subtle);">(${escapeHtml(col.slug)})</span></h2>

                      </td>
                      <td class="mono">${escapeHtml(f.uploadedAt)} · ${escapeHtml(f.uploadedBy)}</td>
                      <td>
                        <button type="button" class="btn btn-danger js-doc-delete" data-col-id="${col.id}" data-doc-id="${f.id}">Delete</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

      });

      // Share Collection Dialog

        btn.addEventListener('click', () => {
          const col = state.collections.find((c) => c.id === btn.getAttribute('data-col-id'));

          openModal(`
            <h2 id="modal-title" style="font-size:var(--text-lg);">Share collection "${escapeHtml(col.name)}"</h2>
            <form id="share-col-form" style="display:flex;flex-direction:column;gap:12px;">
              <label style="font-size:var(--text-xs);font-weight:700;color:var(--text-subtle);">Apps allowed to query this collection (comma-separated)</label>
              <input type="text" id="share-col-input" class="input mono" value="${escapeHtml(col.sharedWith.join(', '))}" />
              <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button type="button" class="btn" id="share-col-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Sharing Permissions</button>
              </div>
            </form>
          `);
          document.getElementById('share-col-cancel').addEventListener('click', closeModal);
          document.getElementById('share-col-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const raw = document.getElementById('share-col-input').value;
            col.sharedWith = raw.split(',').map((s) => s.trim()).filter(Boolean);
            closeModal();
            showToast(`Updated shared apps for ${col.slug}`);
            renderActivePanel();
          });

      // Move Document Dialog
      container.querySelectorAll('.js-col-move').forEach((btn) => {
        btn.addEventListener('click', () => {
          const srcCol = state.collections.find((c) => c.id === btn.getAttribute('data-col-id'));
          if (!srcCol || srcCol.files.length === 0) {
            showToast('No files in this collection to move');
            return;
          }
          openModal(`
            <h2 id="modal-title" style="font-size:var(--text-lg);">Move file from ${escapeHtml(srcCol.name)}</h2>
            <form id="move-doc-form" style="display:flex;flex-direction:column;gap:12px;">
              <label style="font-size:var(--text-xs);font-weight:700;color:var(--text-subtle);">Select file</label>
              <select id="move-file-id" class="select">
                ${srcCol.files.map((f) => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')}
              </select>
              <label style="font-size:var(--text-xs);font-weight:700;color:var(--text-subtle);">Target collection</label>
              <select id="move-target-col" class="select">
                ${state.collections.filter((c) => c.id !== srcCol.id).map((c) => `<option value="${c.id}">${escapeHtml(c.name)} (${escapeHtml(c.slug)})</option>`).join('')}
              </select>
              <div style="display:flex;justify-content:flex-end;gap:8px;">
                <button type="button" class="btn" id="move-doc-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary">Move Document</button>
              </div>
            </form>
          `);
          document.getElementById('move-doc-cancel').addEventListener('click', closeModal);
          document.getElementById('move-doc-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const fId = document.getElementById('move-file-id').value;
            const dstId = document.getElementById('move-target-col').value;
            const dstCol = state.collections.find((c) => c.id === dstId);
            const idx = srcCol.files.findIndex((f) => f.id === fId);
            if (idx >= 0 && dstCol) {
              const [moved] = srcCol.files.splice(idx, 1);
              dstCol.files.unshift(moved);
              rebuildBookshelves3D();
              closeModal();
              showToast(`Moved ${moved.name} to ${dstCol.slug}`);
              renderActivePanel();
            }
          });
        });
      });

      // Delete Document with Confirm
      container.querySelectorAll('.js-doc-delete').forEach((btn) => {
        btn.addEventListener('click', () => {
          const col = state.collections.find((c) => c.id === btn.getAttribute('data-col-id'));
          const docId = btn.getAttribute('data-doc-id');
          const file = col?.files.find((f) => f.id === docId);
          if (!col || !file) return;

          openModal(`
            <h2 id="modal-title" style="font-size:var(--text-lg);">Delete "${escapeHtml(file.name)}"?</h2>
            <p style="font-size:var(--text-sm);color:var(--text-muted);">
              Removing this PDF purges its vector chunks from Qdrant collection <span class="mono">${escapeHtml(col.slug)}</span> and updates the 3D Library bookshelf.
            </p>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
              <button type="button" class="btn" id="del-doc-cancel">Cancel</button>
              <button type="button" class="btn btn-danger" id="del-doc-confirm">Confirm Delete</button>
            </div>
          `);
          document.getElementById('del-doc-cancel').addEventListener('click', closeModal);
          document.getElementById('del-doc-confirm').addEventListener('click', () => {
            col.files = col.files.filter((f) => f.id !== docId);
            col.chunks = Math.max(0, col.chunks - 140);
            rebuildBookshelves3D();
            closeModal();
            showToast(`Deleted ${file.name} from ${col.slug}`);
            renderActivePanel();
          });
        });
      });
    }

    function openUploadDocumentDialog() {
      openModal(`
        <h2 id="modal-title" style="font-size:var(--text-lg);">Upload PDF Document</h2>
        <form id="upload-pdf-form" style="display:flex;flex-direction:column;gap:12px;">
          <label style="font-size:var(--text-xs);font-weight:700;color:var(--text-subtle);">PDF File Name</label>
          <input type="text" id="up-file-name" class="input" value="ITI_Travel_Allowance_Policy_2026.pdf" required />
          <label style="font-size:var(--text-xs);font-weight:700;color:var(--text-subtle);">Destination Collection (or type a new slug below)</label>
          <select id="up-col-select" class="select">
            ${state.collections.map((c) => `<option value="${c.id}">${escapeHtml(c.name)} (${escapeHtml(c.slug)})</option>`).join('')}
            <option value="__new__">＋ Create a new collection...</option>
          </select>
          <input type="text" id="up-new-col-name" class="input input-sm" placeholder="New collection name (if creating new)" style="display:none;" />
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn" id="up-pdf-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Upload & Index PDF</button>
          </div>
        </form>
      `);
      const sel = document.getElementById('up-col-select');
      const newInput = document.getElementById('up-new-col-name');
      sel.addEventListener('change', () => {
        newInput.style.display = sel.value === '__new__' ? 'block' : 'none';
      });
      document.getElementById('up-pdf-cancel').addEventListener('click', closeModal);
      document.getElementById('upload-pdf-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const fname = document.getElementById('up-file-name').value.trim();
        let targetCol = state.collections.find((c) => c.id === sel.value);
        if (sel.value === '__new__') {
          const rawName = newInput.value.trim() || 'Finance SOPs 2026';
          const slug = rawName.toLowerCase().replace(/[^a-z0-9]+/g, '-');
          targetCol = {
            id: 'col_' + Date.now(),
            slug,
            name: rawName,
            owner: 'Vince Bautista (ITI)',
            sharedWith: ['hr-portal-assistant'],
            chunks: 0,
            files: []
          };
          state.collections.push(targetCol);
        }
        if (targetCol && fname) {
          targetCol.files.forEach((existing) => {
            if (existing.name.toLowerCase() === fname.toLowerCase()) {
              existing.status = 'Replaced by a newer upload';
            }
          });
          targetCol.files.unshift({
            id: 'doc_' + Date.now(),
            name: fname,
            size: '2.6 MB',
            status: 'Indexed',
            uploadedAt: '2026-10-26 13:29 PHT',
            uploadedBy: state.role === 'tester' ? 'marco.tan' : 'vince.bautista'
          });
          targetCol.chunks += 185;
          rebuildBookshelves3D();
          closeModal();
          showToast(`Indexed ${fname} into ${targetCol.slug}`);
          renderActivePanel();
        }
      });
    }

    /* --------------------------------------------------------------------------
       PANEL 5: CHAT (/chat + /chat/[id])
       -------------------------------------------------------------------------- */
    function renderChatPanel(container) {
      const activeConv = state.chatEmptyPreview
        ? null
        : state.conversations.find((c) => c.id === state.activeChatId) || state.conversations[0];

      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div style="display:flex;gap:8px;align-items:center;">
            <button type="button" class="btn btn-primary" id="chat-new-thread-btn">＋ New Conversation</button>
            <button type="button" class="btn" id="chat-add-doc-btn">📎 Add a document (PDF)</button>
          </div>
          <button type="button" class="btn" id="chat-toggle-empty-btn">
            ${state.chatEmptyPreview ? 'Show Active Threads' : 'Preview "Ask the company documents" Empty State'}
          </button>
        </div>

        <div class="chat-split">
          <div class="chat-sidebar">
            <div style="font-size:var(--text-xs);font-weight:700;color:var(--text-subtle);text-transform:uppercase;">
              Conversations ${state.role === 'tester' ? '(Tester Scope)' : ''}
            </div>
            ${state.chatEmptyPreview ? `
              <p style="font-size:var(--text-xs);color:var(--text-muted);padding:12px 0;">
                No conversations yet. Start a thread on the right to query indexed ITI PDFs.
              </p>
            ` : state.conversations.map((c) => `
              <button
                type="button"
                class="nav-station-btn js-chat-select"
                data-conv-id="${c.id}"
                ${activeConv && activeConv.id === c.id ? 'aria-current="page"' : ''}
              >
                <div>
                  <div style="font-size:var(--text-xs);">${escapeHtml(c.title)}</div>
                  <span class="nav-station-meta mono">${escapeHtml(c.collection)}</span>
                </div>
              </button>
            `).join('')}
          </div>

          <div class="chat-thread-box">
            ${!activeConv ? `
              <div style="margin:auto;text-align:center;padding:32px 16px;">
                <h2 style="font-size:var(--text-lg);">Ask the company documents</h2>
                <p style="font-size:var(--text-sm);color:var(--text-muted);margin-top:6px;">
                  Answers are streamed from verified ITI PDFs with exact page citations, or reply <em>"I don't know"</em> when a topic is not covered.
                </p>
              </div>
            ` : `
              <div class="chat-messages" id="chat-messages-scroll">
                ${activeConv.messages.map((m) => `
                  <div class="chat-bubble ${m.role === 'user' ? 'user' : 'assistant'}">
                    <div style="display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--text-subtle);margin-bottom:4px;">
                      <strong>${m.role === 'user' ? 'You' : 'ITI AI Assistant'}</strong>
                      ${m.outcome ? `<span class="badge ${m.outcome === 'Answered' ? 'badge-ok' : 'badge-warn'}">${escapeHtml(m.outcome)}</span>` : ''}
                    </div>
                    <div>${escapeHtml(m.text)}</div>
                    ${m.sources && m.sources.length ? `
                      <div class="citation-list">
                        <span style="font-size:var(--text-xs);color:var(--text-subtle);font-weight:700;">Sources:</span>
                        ${m.sources.map((s) => `
                          <span class="badge badge-accent mono" title="${escapeHtml(s.snippet)}">
                            📄 ${escapeHtml(s.file)} · ${escapeHtml(s.page)}
                          </span>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            `}

            <form id="chat-composer-form" style="display:flex;gap:8px;align-items:center;border-top:1px solid var(--border-subtle);padding-top:10px;">
              <input
                type="text"
                id="chat-prompt-input"
                class="input input-sm"
                style="flex:1;"
                placeholder="Ask a question about HR policies, IT security, or HMO benefits..."
                value="What is the bereavement leave entitlement for immediate family?"
              />
              ${state.isStreaming ? `
                <button type="button" class="btn btn-danger" id="chat-stop-btn">■ Stop</button>
              ` : `
                <button type="submit" class="btn btn-primary">Send ›</button>
              `}
            </form>
          </div>
        </div>
      `;

      container.querySelector('#chat-add-doc-btn').addEventListener('click', openUploadDocumentDialog);
      container.querySelector('#chat-toggle-empty-btn').addEventListener('click', () => {
        state.chatEmptyPreview = !state.chatEmptyPreview;
        renderActivePanel();
      });

      container.querySelector('#chat-new-thread-btn').addEventListener('click', () => {
        state.chatEmptyPreview = false;
        const newId = 'conv_' + Date.now();
        state.conversations.unshift({
          id: newId,
          title: 'New policy inquiry',
          collection: 'hr-policies',
          startedAt: '2026-10-26 13:30 PHT',
          messages: []
        });
        state.activeChatId = newId;
        renderActivePanel();
      });

      container.querySelectorAll('.js-chat-select').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.chatEmptyPreview = false;
          state.activeChatId = btn.getAttribute('data-conv-id');
          renderActivePanel();
        });
      });

      container.querySelector('#chat-stop-btn')?.addEventListener('click', () => {
        if (state.streamTimer) clearInterval(state.streamTimer);
        state.isStreaming = false;
        showToast('Stopped SSE response stream');
        renderActivePanel();
      });

      container.querySelector('#chat-composer-form').addEventListener('submit', (e) => {
        e.preventDefault();
        if (state.isStreaming) return;
        const promptInput = container.querySelector('#chat-prompt-input');
        const text = promptInput.value.trim();
        if (!text) return;

        state.chatEmptyPreview = false;
        let conv = state.conversations.find((c) => c.id === state.activeChatId);
        if (!conv) {
          conv = state.conversations[0];
          state.activeChatId = conv.id;
        }
        if (conv.messages.length === 0) {
          conv.title = text.slice(0, 34);
        }
        conv.messages.push({ role: 'user', text });

        const isOutScope = /crypto|bitcoin|stock|weather|secret|password/i.test(text);
        const fullReply = isOutScope
          ? 'I don\'t know. That topic is not present in the indexed Intellismart company documents.'
          : 'Under the 2026 ITI Employee Handbook, regular and probationary employees are granted **5 paid Bereavement Leave days** for the loss of an immediate family member (spouse, child, parent, or sibling), filed via HRDotNet within 10 days of return.';
        const replyMsg = {
          role: 'assistant',
          text: '▍',
          outcome: isOutScope ? 'I don\'t know' : 'Answered',
          sources: isOutScope
            ? []
            : [
                { file: 'ITI_Employee_Handbook_2026_v4.pdf', page: 'p. 19', snippet: 'Section 4.7: Five (5) paid Bereavement Leave days for immediate family.' }
              ]
        };
        conv.messages.push(replyMsg);

        state.isStreaming = true;
        let idx = 0;
        const words = fullReply.split(' ');
        renderActivePanel();

        state.streamTimer = setInterval(() => {
          idx += 3;
          if (idx >= words.length) {
            replyMsg.text = fullReply;
            clearInterval(state.streamTimer);
            state.isStreaming = false;
            renderActivePanel();
          } else {
            replyMsg.text = words.slice(0, idx).join(' ') + ' ▍';
            renderActivePanel();
          }
        }, 70);
      });
    }

        <div class="segmented" role="tablist" aria-label="Tools & MCP tabs">

    function renderListViewApp() {
      document.documentElement.setAttribute("data-theme", lvState.theme);
      state.theme = lvState.theme;
      document.getElementById("theme-toggle-label").textContent =
        state.theme === "dark" ? "☀ Light Paper" : "☾ Dark Navy";
      syncSceneThemeAndRoles();

      document.getElementById("ctrl-theme-btn").textContent =
        lvState.theme === "dark" ? "☀ Switch to Light (Paper)" : "☾ Switch to Dark (Navy)";
      document.getElementById("sidebar-theme-btn").textContent =
        lvState.theme === "dark" ? "☀" : "☾";

      document.getElementById("ctrl-page").value = lvState.page;
      document.getElementById("ctrl-role").value = lvState.role;
      document.getElementById("ctrl-state").value = lvState.viewState;

      const shellContainer = document.getElementById("shell-container");
      const sidebar = document.getElementById("sidebar-nav");
      const workspace = document.getElementById("main-workspace");

      if (lvState.page === "login") {
        shellContainer.className = "shellFull";
        sidebar.style.display = "none";
        workspace.innerHTML = lvRenderLogin();
        return;
      }

      shellContainer.className = "shell";
      sidebar.style.display = "";
      lvRenderSidebar();

      const map = {
        overview: lvRenderOverview,
        performance: lvRenderPerformance,
        requests: lvRenderRequests,
        documents: lvRenderDocuments,
        chat: lvRenderChat,
        companies: lvRenderCompanies,
        apps: lvRenderApps,
        users: lvRenderUsers,
        accounts: lvRenderAccounts,
        tools: lvRenderTools
      };
      workspace.innerHTML = (map[lvState.page] || lvRenderOverview)();
      if (typeof enhanceAllSelects === "function") enhanceAllSelects();
    }

    /* ==========================================================================
       8B. CUSTOM THEMED DROPDOWN ENHANCER (All <select> elements follow theme)
       ========================================================================== */
    let activeDropdownMenu = null;
    let activeDropdownTrigger = null;

    function closeActiveThemedDropdown() {
      if (activeDropdownMenu) {
        activeDropdownMenu.classList.remove('open');
        activeDropdownMenu.remove();
        activeDropdownMenu = null;
      }
      if (activeDropdownTrigger) {
        activeDropdownTrigger.setAttribute('aria-expanded', 'false');
        activeDropdownTrigger = null;
      }
    }

    function openThemedDropdownFor(sel, trigger, syncTriggerLabel) {
      if (activeDropdownTrigger === trigger) {
        closeActiveThemedDropdown();
        return;
      }
      closeActiveThemedDropdown();

      syncTriggerLabel();
      const menu = document.createElement('div');
      menu.className = 'iti-select-menu open';
      menu.setAttribute('role', 'listbox');

      Array.from(sel.options).forEach((opt, idx) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'iti-select-option';
        item.setAttribute('role', 'option');
        const isSelected = idx === sel.selectedIndex;
        item.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        item.innerHTML = `
          <span>${escapeHtml(opt.textContent)}</span>
          <span class="iti-select-check" aria-hidden="true">${isSelected ? '✓' : ''}</span>
        `;
        item.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          sel.selectedIndex = idx;
          sel.value = opt.value;
          syncTriggerLabel();
          closeActiveThemedDropdown();
          sel.dispatchEvent(new Event('change', { bubbles: true }));
          trigger.focus();
        });
        menu.appendChild(item);
      });

      document.body.appendChild(menu);
      const rect = trigger.getBoundingClientRect();
      const menuW = Math.max(rect.width, 190);
      menu.style.minWidth = `${Math.round(menuW)}px`;

      const spaceBelow = window.innerHeight - rect.bottom;
      const leftPos = Math.min(rect.left, window.innerWidth - menuW - 12);
      menu.style.left = `${Math.max(8, Math.round(leftPos))}px`;
      if (spaceBelow < 220 && rect.top > 220) {
        menu.style.bottom = `${Math.round(window.innerHeight - rect.top + 6)}px`;
      } else {
        menu.style.top = `${Math.round(rect.bottom + 6)}px`;
      }

      trigger.setAttribute('aria-expanded', 'true');
      activeDropdownMenu = menu;
      activeDropdownTrigger = trigger;
    }

    function enhanceSelectElement(sel) {
      if (!sel || sel.dataset.itiEnhanced === 'true') return;
      sel.dataset.itiEnhanced = 'true';

      const wrapper = document.createElement('span');
      wrapper.className = 'iti-select-wrapper';
      if (sel.style.width) wrapper.style.width = sel.style.width;
      if (sel.style.flex) wrapper.style.flex = sel.style.flex;

      const isPill = sel.classList.contains('protoSelect');
      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'iti-select-trigger' + (isPill ? ' pill-trigger' : '');
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-expanded', 'false');
      if (sel.getAttribute('aria-label')) {
        trigger.setAttribute('aria-label', sel.getAttribute('aria-label'));
      }

      const labelSpan = document.createElement('span');
      labelSpan.className = 'iti-select-label';
      const chevSpan = document.createElement('span');
      chevSpan.className = 'iti-select-chevron';
      chevSpan.setAttribute('aria-hidden', 'true');
      chevSpan.textContent = '▾';

      trigger.appendChild(labelSpan);
      trigger.appendChild(chevSpan);

      function syncTriggerLabel() {
        const opt = sel.options[sel.selectedIndex] || sel.options[0];
        labelSpan.textContent = opt ? opt.textContent : '';
      }
      syncTriggerLabel();
      sel._itiSyncLabel = syncTriggerLabel;

      // Prevent enclosing <label> from firing synthetic clicks on hidden <select>
      const parentLabel = sel.closest('label');
      if (parentLabel && !parentLabel.dataset.itiLabelBound) {
        parentLabel.dataset.itiLabelBound = 'true';
        parentLabel.addEventListener('click', (ev) => {
          if (ev.target === trigger || trigger.contains(ev.target)) {
            ev.preventDefault();
            return;
          }
          ev.preventDefault();
          ev.stopPropagation();
          openThemedDropdownFor(sel, trigger, syncTriggerLabel);
        });
      }

      if (sel.id) {
        const extLabel = document.querySelector(`label[for="${sel.id}"]`);
        if (extLabel && !extLabel.dataset.itiLabelBound) {
          extLabel.dataset.itiLabelBound = 'true';
          extLabel.addEventListener('click', (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            openThemedDropdownFor(sel, trigger, syncTriggerLabel);
          });
        }
      }

      // Hide native OS select visually while keeping it in DOM for programmatic value/event compatibility
      sel.style.position = 'absolute';
      sel.style.opacity = '0';
      sel.style.pointerEvents = 'none';
      sel.style.width = '1px';
      sel.style.height = '1px';
      sel.tabIndex = -1;

      sel.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
      });

      sel.parentNode.insertBefore(wrapper, sel);
      wrapper.appendChild(sel);
      wrapper.appendChild(trigger);

      trigger.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openThemedDropdownFor(sel, trigger, syncTriggerLabel);
      });

      trigger.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const dir = e.key === 'ArrowDown' ? 1 : -1;
          const nextIdx = Math.max(0, Math.min(sel.options.length - 1, sel.selectedIndex + dir));
          if (nextIdx !== sel.selectedIndex) {
            sel.selectedIndex = nextIdx;
            sel.value = sel.options[nextIdx].value;
            syncTriggerLabel();
            sel.dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
      });

      sel.addEventListener('change', syncTriggerLabel);
    }

    function enhanceAllSelects() {
      document.querySelectorAll('select').forEach((sel) => {
        enhanceSelectElement(sel);
        if (sel._itiSyncLabel) sel._itiSyncLabel();
      });
    }

    document.addEventListener('pointerdown', (e) => {
      if (!activeDropdownMenu) return;
      if (activeDropdownMenu.contains(e.target)) return;
      if (activeDropdownTrigger && activeDropdownTrigger.contains(e.target)) return;
      closeActiveThemedDropdown();
    });
    window.addEventListener('resize', () => closeActiveThemedDropdown());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && activeDropdownMenu) {
        closeActiveThemedDropdown();
      }
    });

    /* ==========================================================================
       9. INITIALIZE ON WINDOW LOAD
       ========================================================================== */
    window.addEventListener('load', () => {
      initThreeWorld();
      buildHotspotButtons();
      renderNavigationDock();
      bindTopControls();
      bindListViewEvents();
      renderActivePanel();
      renderListViewApp();
      enhanceAllSelects();
      requestAnimationFrame(animateLoop);
    });
  </script>
